[package]
name = "dagrs"
authors = [
    "Quanyi Ma <eli@patch.sh>",
    "Xiaolong Fu <njufxl@gmail.com>",
    "Zhilei Qiu <qzl2503687@gmail.com>",
]
version = "0.8.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Dagrs follows the concept of Flow-based Programming and is suitable for the execution of multiple tasks with graph-like dependencies. Dagrs has the characteristics of high performance and asynchronous execution. It provides users with a convenient programming interface."
readme = "README.md"
repository = "https://github.com/dagrs-dev/dagrs"
keywords = ["DAG", "task", "async", "fbp", "tokio"]

[workspace]
members = ["dagrs-derive"]
resolver = "2"

[workspace.dependencies]
dagrs-derive = { path = "dagrs-derive", version = "0.5.0" }
tokio = { version = "1.48.0", features = ["full"] }
log = "0.4.28"
async-trait = "0.1.89"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = "2.0.0"

[dependencies]
dagrs-derive = {workspace = true}
tokio = { workspace = true , features = ["macros", "rt", "sync", "rt-multi-thread", "time"] }
log = {workspace = true}
async-trait = {workspace = true}
futures = {workspace = true}
serde = { workspace= true }
serde_json = { workspace= true }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
env_logger = "0.11.6"

[target.'cfg(unix)'.dev-dependencies]

[features]
default = ["derive"]
derive = ["dagrs-derive/derive"]

[[example]]
name = "auto_node"
required-features = ["derive"]

[[example]]
name = "auto_relay"
required-features = ["derive"]

[[example]]
name = "compute_dag"

[[example]]
name = "custom_node"

[[example]]
name = "hello_dagrs"
